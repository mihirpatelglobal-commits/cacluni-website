name: Verify Statutory Figures

on:
  schedule:
    # 09:00 UTC on the 1st of every month
    - cron: '0 9 1 * *'
  workflow_dispatch:
    # Allow manual trigger for testing or out-of-cycle checks

permissions:
  contents: write   # needed to commit verification_date bumps to statutory_inventory.json
  issues: write     # needed to create/update the review issue — GITHUB_TOKEN is sufficient, no PAT required

jobs:
  verify:
    name: Verify Statutory Figures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch with token so the subsequent push step has write access
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run verification script
        id: verify
        # Exit code 0 = all MATCH; exit code 1 = one or more MISMATCH/COULD_NOT_VERIFY
        run: node scripts/verify_statutory_figures.js
        continue-on-error: true

      - name: Capture exit code
        id: outcome
        run: |
          echo "has_issues=${{ steps.verify.outcome == 'failure' && 'true' || 'false' }}" >> $GITHUB_OUTPUT

      # ── Path A: Issues found → create or update a GitHub Issue ────────────
      - name: Ensure label exists
        if: steps.outcome.outputs.has_issues == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "statutory-figure-check" \
            --color "e4e669" \
            --description "Automated statutory figure verification alert" \
            2>/dev/null || true   # ignore error if label already exists

      - name: Create or update GitHub Issue
        if: steps.outcome.outputs.has_issues == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date '+%Y-%m-%d')
          MISMATCH_COUNT=$(grep -c "^### " verification_report.md || echo "0")
          TITLE="Statutory Figure Check — ${DATE} — ${MISMATCH_COUNT} figure(s) need review"
          BODY=$(cat verification_report.md)

          # Look for an existing open issue with our label to avoid duplicates
          EXISTING_NUMBER=$(gh issue list \
            --label "statutory-figure-check" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING_NUMBER" ]; then
            echo "Updating existing issue #${EXISTING_NUMBER}"
            gh issue edit "$EXISTING_NUMBER" \
              --title "$TITLE" \
              --body "$BODY"
            gh issue comment "$EXISTING_NUMBER" \
              --body "⚠️ Re-checked on ${DATE}. Report updated above. No changes have been made to any calculator pages."
          else
            echo "Creating new issue"
            gh issue create \
              --title "$TITLE" \
              --label "statutory-figure-check" \
              --body "$BODY"
          fi

      # ── Path B: All matched → commit verification_date bumps only ──────────
      - name: Commit updated verification dates
        if: steps.outcome.outputs.has_issues == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add statutory_inventory.json
          # Only commit if there's actually a staged change (idempotent).
          # $(date '+%Y-%m-%d') is evaluated inline here — no env var dependency.
          git diff --staged --quiet || \
            git commit -m "chore: statutory figure verification_dates confirmed $(date '+%Y-%m-%d') [skip ci]"
          git push

      - name: Upload report as workflow artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report-${{ github.run_id }}
          path: verification_report.md
          retention-days: 90
